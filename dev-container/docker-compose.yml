# Puts a second, Ubuntu-based pair of containers on the same Docker network
# (hpcqc-net) from the start, so test/submit_mqss_job_offload.sbatch can
# reach grpc_qcscheduler by container name without a manual `docker network
# connect` step. See ./Readme.md.
#
# Named qc-container / hpc-container, distinct from the pre-existing,
# manually-created mqss_scheduler_dev / mqss-slurm-testbed containers (Rocky
# Linux, already has the full LLVM/QDMI/submitter/scheduler build). NOTE:
# hpcqc-net is a *different* network from mqss-net, which is what
# mqss_scheduler_dev/mqss-slurm-testbed are on — this pair is fully separate
# from that one now (no cross-reachability), not just distinctly named on a
# shared network like it used to be. See Readme's "Known gaps"/network
# section if you want them reachable from each other again.

# Project name — without this, compose derives it from this directory's name
# (dev-container), which prefixes `docker compose ps`/`down`/etc. groupings.
# Setting it explicitly here means it's mqss-dev-testbed regardless of what
# the directory is called, and `docker compose up` (no -p flag needed) always
# targets the same project.
name: mqss-dev-testbed

services:
  # The real pipeline: Scheduler/Submitter/QDMI, built from the bind-mounted
  # MQSS-Scheduler repo (source lives outside the image on purpose — see the
  # original mqss_img Dockerfile this is derived from). Ubuntu-based and
  # freshly built — does NOT yet have LLVM/QDMI/submitter/scheduler built
  # (see Readme's Known gaps); that still only exists in mqss_scheduler_dev.
  qc-container:
    build:
      context: .
      dockerfile: qc-dockerfile/Dockerfile
    image: qc-container-img
    container_name: qc-container
    hostname: qc-container
    # Without this, `sleep infinity` (the CMD) runs directly as PID 1, which
    # never reaps zombie children (e.g. mpirun/qrm_qcscheduler processes
    # killed with pkill get reparented to PID 1 and stay <defunct> forever,
    # since a bare `sleep` never calls wait() on SIGCHLD). init: true makes
    # Docker wrap PID 1 with tini, which does.
    init: true
    command: ["sleep", "infinity"]
    volumes:
      # Just this repo — NOT the whole ~/Projects/mqss workspace like
      # mqss_scheduler_dev mounts. That wider mount was making Tab-completion
      # (and any other readdir/stat-heavy operation) crawl or hang, since it
      # pulls in every sibling repo's build output too — hundreds of
      # thousands of files across a slow bind-mount layer. Everything this
      # container's build needs (QDMI/QInfo/submitter/QDMI-Device-Example)
      # is vendored under dependencies/ in this repo already.
      - ..:/home/admin/shared/MQSS-Scheduler
      # LLVM is the one thing not vendored here — it's shared across all
      # sibling MQSS repos at the host's top-level dependencies/installed/.
      # Verified (compiled+linked+ran a real test program against it here)
      # that this Rocky-9-built LLVM 16.0.6 works fine under Ubuntu 24.04
      # despite being built on a different distro — glibc/libstdc++ are
      # backward compatible in this direction (old binary, newer runtime),
      # so no Ubuntu-native rebuild is actually needed. Mounted read-only,
      # at exactly the path build.sh's LLVM_ROOT already defaults to, so no
      # env var override is needed either. Targeted like this (not baked
      # into the image) so it doesn't reintroduce the tab-completion
      # slowness — this is one bounded directory, not dozens of sibling
      # repos — and stays in sync automatically if the host LLVM changes.
      - ../../dependencies/installed:/home/admin/shared/dependencies/installed:ro
    networks:
      - mqss-net
    tty: true
    stdin_open: true

  # Slurm + mqss-spank-plugin testbed — see
  # ../slurm-spank-plugins/mqss-spank-plugin/Readme.md for what this is.
  hpc-container:
    build:
      # This Dockerfile's COPY instructions (slurm-config/*, and `COPY .
      # /workspace` pulling in the whole plugin source tree) need
      # ../slurm-spank-plugins/mqss-spank-plugin as context, not
      # dev-container/ — the Dockerfile living under hpc-dockerfile/ here is
      # independent of where its build context is; BuildKit supports a
      # Dockerfile located outside its own context directory.
      context: ../slurm-spank-plugins/mqss-spank-plugin
      dockerfile: ../../dev-container/hpc-dockerfile/Dockerfile
    image: hpc-container-img
    container_name: hpc-container
    hostname: hpc-container
    # Keeps the image's real ENTRYPOINT (starts munge/slurmctld/slurmd) but
    # overrides CMD so the container stays up under `docker compose up -d`
    # instead of running the one-shot test suite — same trick
    # create_container.sh already used.
    command: ["sleep", "infinity"]
    volumes:
      - ../slurm-spank-plugins/mqss-spank-plugin:/workspace
    networks:
      - mqss-net
    tty: true
    stdin_open: true

networks:
  # external: true — expects hpcqc-net to already exist (`docker network
  # create hpcqc-net` once, if it doesn't yet) rather than letting compose
  # create/own it. Without `external: true`, compose insists on a label it
  # didn't set itself and refuses to start against any network it didn't
  # create — this network is intentionally its own, separate from mqss-net
  # (see top-of-file note).
  mqss-net:
    name: hpcqc-net
    external: true
