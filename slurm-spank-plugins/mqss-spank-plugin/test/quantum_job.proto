// Minimal offload contract between a Slurm-submitted job (client, see
// bell_state_offload.py) and a remote MQSS-Scheduler-side listener (server,
// see mqss-scheduler-grpc/listener.py). This is a stub contract for testing the
// SPANK-plugin -> network dispatch -> remote execution round trip; the real
// MQSS-Scheduler would replace SubmitCircuit's implementation with actual
// queueing/scheduling/QDMI dispatch instead of immediate local execution.
syntax = "proto3";

package mqss;

service QuantumJobService {
  // Submit a single circuit and block until it has been executed.
  rpc SubmitCircuit(CircuitRequest) returns (CircuitResult);
}

message CircuitRequest {
  // Client-generated correlation id (e.g. the submitting Slurm job ID).
  string job_id = 1;
  // MQSS_QC_ALIAS of the target QC, as injected by mqss-spank-plugin.
  string qc_alias = 2;
  // Serialization format of `program` (e.g. "qasm3").
  string program_format = 3;
  // The serialized circuit itself.
  string program = 4;
  int32 shots = 5;
}

message CircuitResult {
  string job_id = 1;
  bool success = 2;
  // Populated only when success is false.
  string error_message = 3;
  // Measurement outcome (e.g. "00", "11") -> observed count.
  map<string, int32> counts = 4;
}
