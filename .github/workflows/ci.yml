name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files

  build-and-test:
    name: Build & Test (dev-container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Same image developers use locally (dev-container/qc-dockerfile/Dockerfile) -
      # one toolchain definition instead of a second, separately-drifting apt
      # install list just for CI.
      - name: Build dev-container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: dev-container/qc-dockerfile/Dockerfile
          tags: scheduler-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure, build, and test
        run: |
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
            scheduler-ci:latest \
            bash -c "
              set -eu
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SCHEDULER_TESTS=ON
              cmake --build build -j\$(nproc)
              ctest --test-dir build --output-on-failure
            "

  coverage:
    name: Coverage (dev-container)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build dev-container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: dev-container/qc-dockerfile/Dockerfile
          tags: scheduler-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure, build, and test with coverage
        run: |
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
            scheduler-ci:latest \
            bash -c "
              set -eu
              apt-get update -qq && apt-get install -y -qq --no-install-recommends gcovr
              cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DBUILD_SCHEDULER_TESTS=ON \
                -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage \
                -DCMAKE_EXE_LINKER_FLAGS=--coverage -DCMAKE_SHARED_LINKER_FLAGS=--coverage
              cmake --build build-coverage -j\$(nproc)
              ctest --test-dir build-coverage --output-on-failure
              gcovr --root /workspace --filter /workspace/src/ --filter /workspace/include/ \
                --xml coverage.xml --print-summary build-coverage
            "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Switch to true (as in QDMI) once the repository is registered with Codecov.
          fail_ci_if_error: false
          files: coverage.xml
          flags: cpp

  required-checks-pass: # This job does nothing and is only used for branch protection
    name: 🚦 Check
    if: always()
    needs:
      - pre-commit
      - build-and-test
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
